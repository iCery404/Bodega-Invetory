name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          unzip -o BodegaInventory-Native.zip
          if [ -d BodegaInventory ]; then cp -a BodegaInventory/. .; rm -rf BodegaInventory; fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: |
          java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BodegaInventory-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
